<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="날짜별로 모아 보는 Jake의 웹 프로젝트">
  <title>jakeweb</title>
  <link rel="stylesheet" href="/style.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <header><a class="brand" href="/">jakeweb<span>.</span></a><button id="open">+ New Web</button></header>
  <main>
    <h1>웹사이트 모음</h1>
    <p class="intro">하루씩 쌓아가는 웹 프로젝트.</p>
    <p id="list-status" role="status">웹사이트를 불러오는 중…</p>
    <ol id="sites" aria-label="등록된 웹사이트"></ol>
  </main>
  <dialog id="editor" aria-labelledby="editor-title">
    <button type="button" class="close" id="close" aria-label="닫기">×</button>
    <h2 id="editor-title">New Web</h2>
    <form id="login">
      <label>관리자 비밀번호 <input id="password" type="password" autocomplete="current-password" required maxlength="1024"></label>
      <button>확인</button>
    </form>
    <form id="add" hidden>
      <label>DAY 번호 <input id="day" type="number" min="1" max="999999" step="1" required></label>
      <label>웹사이트 주소 <input id="url" type="url" placeholder="https://example.vercel.app" required maxlength="2048"></label>
      <label>짧은 설명 <textarea id="description" rows="3" required maxlength="160"></textarea></label>
      <button>등록</button>
    </form>
    <p id="feedback" role="status"></p>
  </dialog>
</body>
</html>
